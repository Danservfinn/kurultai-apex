<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Kurultai</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/mark.svg" type="image/svg+xml">
<meta name="color-scheme" content="light dark">
<style>
:root{
  --paper:#faf7f2; --ink:#211d18; --ink-soft:#5c564c; --accent:#3d6b4f;
  --hairline:rgba(33,29,24,.18);
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root{--paper:#141311; --ink:#e9e4da; --ink-soft:#a39c8e; --accent:#8db89b; --hairline:rgba(233,228,218,.22)}
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  line-height:1.6; -webkit-font-smoothing:antialiased;
  min-height:100svh; display:grid; place-content:center;
  padding:2rem 1.5rem; text-align:center;
  background-image:radial-gradient(circle at 50% -20%, var(--hairline), transparent 62%);
}
::selection{background:var(--accent); color:var(--paper)}
a{color:var(--accent); text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:.2em}
a:hover{text-decoration-thickness:2px}
a:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:1px}
.mark{width:5.5rem; height:auto; color:var(--accent); display:block; margin:0 auto 1.8rem; opacity:.85}
.mark .orbit{fill:none; stroke:var(--hairline); stroke-width:.5}
.kicker{
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  font-size:.68rem; letter-spacing:.3em; text-transform:uppercase; color:var(--ink-soft);
  display:flex; align-items:center; justify-content:center; gap:1.1rem; margin-bottom:1rem;
}
.kicker::before,.kicker::after{content:""; width:2.2rem; height:1px; background:var(--hairline)}
h1{font-size:clamp(1.7rem,5vw,2.4rem); font-weight:500; line-height:1.15}
p{margin-top:.9rem; color:var(--ink-soft); max-width:26rem}
.return{margin-top:1.6rem}
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 64 64" role="img" aria-label="Kurultai mark: seven points in a ring around one, one seat empty">
    <circle class="orbit" cx="32" cy="32" r="20"/>
    <g fill="currentColor">
      <circle cx="47.6" cy="19.5" r="3.2"/>
      <circle cx="51.5" cy="36.5" r="3.2"/>
      <circle cx="40.7" cy="50" r="3.2"/>
      <circle cx="23.3" cy="50" r="3.2"/>
      <circle cx="12.5" cy="36.5" r="3.2"/>
      <circle cx="16.4" cy="19.5" r="3.2"/>
      <circle cx="32" cy="32" r="4.5"/>
    </g>
    <circle cx="32" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width=".9"/>
  </svg>
  <p class="kicker">404 · Not found</p>
  <h1>This page is not part of the assembly.</h1>
  <p>Nothing lives at this address. Kurultai is coming.</p>
  <p class="return"><a href="/">Return to kurult.ai</a></p>
</main>
</body>
</html>
