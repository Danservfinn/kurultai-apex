<style>
:root{
  --paper:#faf7f2; --ink:#211d18; --ink-soft:#5c564c; --accent:#3d6b4f;
  --hairline:rgba(33,29,24,.18); --hairline-soft:rgba(33,29,24,.09);
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#141311; --ink:#e9e4da; --ink-soft:#a39c8e; --accent:#8db89b;
    --hairline:rgba(233,228,218,.22); --hairline-soft:rgba(233,228,218,.1);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  line-height:1.6; -webkit-font-smoothing:antialiased;
  min-height:100svh; display:grid; grid-template-rows:1fr auto;
  padding:clamp(1.5rem,4vh,3rem) 1.5rem;
  background-image:radial-gradient(circle at 50% -20%, var(--hairline-soft), transparent 62%);
  text-align:center;
}
::selection{background:var(--accent); color:var(--paper)}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
a{color:var(--accent); text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:.2em}
a:hover{text-decoration-thickness:2px}
a:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:1px}

main{
  align-self:center; justify-self:center;
  max-width:46rem; padding-block:clamp(1rem,4vh,3rem);
}

/* The mark, convening: seven points take their places around one. */
.mark{
  width:clamp(8.5rem,24vmin,12.5rem); height:auto;
  color:var(--accent); display:block; margin-inline:auto;
}
@media (prefers-color-scheme: dark){
  .mark{filter:drop-shadow(0 0 18px rgba(141,184,155,.22))}
}
.mark .orbit{fill:none; stroke:var(--hairline); stroke-width:.5}
.mark .seat{fill:none; stroke:var(--hairline-soft); stroke-width:.5}
@media (prefers-reduced-motion: no-preference){
  .mark .ring{
    transform-box:view-box; transform-origin:center;
    animation:convene 240s linear infinite;
  }
  .mark .pt{opacity:0; animation:arrive 1.1s cubic-bezier(.2,.7,.3,1) forwards}
  .mark .pt:nth-of-type(1){animation-delay:.25s}
  .mark .pt:nth-of-type(2){animation-delay:.65s}
  .mark .pt:nth-of-type(3){animation-delay:1.05s}
  .mark .pt:nth-of-type(4){animation-delay:1.45s}
  .mark .pt:nth-of-type(5){animation-delay:1.85s}
  .mark .pt:nth-of-type(6){animation-delay:2.25s}
  .mark .pt:nth-of-type(7){animation-delay:2.65s}
  .mark .core{
    transform-box:fill-box; transform-origin:center;
    animation:breathe 6s ease-in-out infinite alternate;
  }
  .rise{opacity:0; transform:translateY(10px); animation:rise .7s ease-out forwards}
  .kicker.rise{animation-delay:.15s}
  h1.rise{animation-delay:.3s}
  .gloss.rise{animation-delay:.5s}
  .stamp-block.rise{animation-delay:.7s}
  footer.rise{animation-delay:.9s}
  @keyframes convene{to{transform:rotate(1turn)}}
  @keyframes arrive{from{opacity:0}to{opacity:1}}
  @keyframes breathe{from{transform:scale(1)}to{transform:scale(1.14)}}
  @keyframes rise{to{opacity:1; transform:none}}
}

.kicker{
  margin-top:clamp(1.8rem,5vh,3rem);
  font-size:.68rem; letter-spacing:.3em; text-transform:uppercase;
  color:var(--ink-soft);
  display:flex; align-items:center; justify-content:center; gap:1.1rem;
}
.kicker::before,.kicker::after{content:""; width:2.6rem; height:1px; background:var(--hairline)}

h1{
  margin-top:clamp(1rem,2.5vh,1.6rem);
  font-size:clamp(3.25rem,11vw,6.75rem);
  font-weight:500; line-height:1.02; letter-spacing:-.01em;
}
h1 .soft{display:block; font-style:italic; font-weight:400; color:var(--ink-soft)}

.gloss{
  margin-top:clamp(1.6rem,4vh,2.4rem);
  font-size:1.05rem; color:var(--ink-soft); text-wrap:balance;
}
.gloss i{color:var(--ink)}

.stamp-block{margin-top:clamp(2rem,5vh,3rem)}
.stamp-block::before{content:""; display:block; width:2.6rem; height:1px; background:var(--hairline); margin:0 auto 1.1rem}
.stamp{
  font-size:.7rem; letter-spacing:.18em; text-transform:uppercase;
  color:var(--ink-soft);
}

footer{
  justify-self:center; padding-top:1.1rem;
  font-size:.85rem; color:var(--ink-soft);
  display:flex; flex-wrap:wrap; justify-content:center; gap:.35rem 1.4rem;
}
footer a{color:inherit}
</style>
</head>
<body>

<main>
  <svg class="mark" viewBox="0 0 64 64" role="img" aria-label="Kurultai mark: seven points convening in a ring around one">
    <circle class="orbit" cx="32" cy="32" r="20"/>
    <circle class="seat" cx="32" cy="32" r="9.5"/>
    <g class="ring" fill="currentColor">
      <circle class="pt" cx="32" cy="12" r="3.2"/>
      <circle class="pt" cx="47.6" cy="19.5" r="3.2"/>
      <circle class="pt" cx="51.5" cy="36.5" r="3.2"/>
      <circle class="pt" cx="40.7" cy="50" r="3.2"/>
      <circle class="pt" cx="23.3" cy="50" r="3.2"/>
      <circle class="pt" cx="12.5" cy="36.5" r="3.2"/>
      <circle class="pt" cx="16.4" cy="19.5" r="3.2"/>
    </g>
    <circle class="core" cx="32" cy="32" r="4.5" fill="currentColor"/>
  </svg>

  <p class="kicker mono rise">An independent AI agent lab</p>

  <h1 class="rise">Kurultai <span class="soft">is coming.</span></h1>

  <p class="gloss rise"><i>kurultai</i>, n.&thinsp;—&thinsp;the assembly that chose the khans.<br>The assembly is convening.</p>

  <div class="stamp-block rise">
    <p class="stamp mono">No date promised&thinsp;·&thinsp;it ships when it clears the gate</p>
  </div>
</main>

<footer class="rise">
  <span>Raleigh, North Carolina</span>
  <a href="mailto:d@kurult.ai">d@kurult.ai</a>
  <span>© 2026 Kurultai</span>
</footer>

</body>
</html>
